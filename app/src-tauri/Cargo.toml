[package]
name = "kenes-app"
version = "0.1.0"
description = "Kenes meeting copilot"
authors = ["kenes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kenes_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kenes-types = { workspace = true }
kenes-core = { workspace = true }
kenes-audio = { workspace = true }
kenes-stt = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

# System-wide shortcuts on macOS and X11 (see src/hotkeys.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Wayland: the XDG GlobalShortcuts portal (pure Rust over zbus).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"


